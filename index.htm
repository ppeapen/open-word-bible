  <body class="site-chrome">
    <header class="site-header">
      <h1>The Open Word Bible</h1>
      <p class="subtitle"><strong><i>The Word of God,<br />unlocked and unrestricted</i></strong></p>
      <div style="height: 20px;"></div>
      <p class="p"><small>The Open Word Bible contains the full ecumenical book set. Choose a book.</small></p>
    </header>
    <main class="site-main">
      <!-- Front-matter pages: not "books" with chapters in the usual sense, but still routed through reader.html so the same chapter-toolbar  machinery works for their (single) page too. -->
      <nav class="front-links" id="frontLinks" aria-label="Front matter"></nav>
      <div id="bookList">
        <p class="loading">Loading book list…</p>
      </div>

      <div style="height: 60px;"></div>
      <div id="ebook">
        <a href="./ebook/openWordBible-PhilipEapen.epub" title="Updated: Sept 16, 2026" download="Open Word Bible - Philip Eapen.epub" class="download-btn">Download e-Book (EPUB)</a>
      </div>
    </main>
    <footer class="site-footer">
      <a href="./books/copyright.htm">Public Domain</a> &middot; 
      <a href="./books/webfaq.htm">FAQ</a><br />
      Created & maintained by <a href="https://philipeapen.com/contact/">Philip Eapen</a>
    </footer>
    <script>
    (function () {
      'use strict';

      // Section headings, in display order. "AP" = Apocrypha/Deuterocanon.
      const SECTIONS = [
        { key: 'OT', title: 'Old Testament' },
        { key: 'AP', title: 'Apocrypha' },
        { key: 'NT', title: 'New Testament' },
      ];

      fetch('./books/books.json')
        .then(res => res.json())
        .then(data => {
          renderFrontLinks(data.front || []);
          renderBooks(data.books || []);
        })
        .catch(err => {
          document.getElementById('bookList').innerHTML =
      '<p class="error-box">Could not load the book list (./books/books.json). ' +
      String(err.message || err) + '</p>';
        });

      function renderFrontLinks(frontBooks) {
        const nav = document.getElementById('frontLinks');
        nav.innerHTML = frontBooks
          .map(b => `<a href="./books/reader.html?book=${encodeURIComponent(b.code)}">${b.name}</a>`)
          .join('');
      }

      function renderBooks(books) {
        const html = SECTIONS.map(section => {
          const inSection = books.filter(b => b.testament === section.key);
          if (!inSection.length) return '';
          return (
      `<div class="testament-group">` +
      `<h2>${section.title}</h2>` +
      `<div class="book-grid">` +
      inSection.map(bookCard).join('') +
      `</div></div>`
          );
        }).join('');

        document.getElementById('bookList').innerHTML = html;
      }

      function bookCard(book) {
        const href = `./books/reader.html?book=${encodeURIComponent(book.code)}`;
        return `<a class="book-card" href="${href}">${book.name}</a>`;
      }
    })();
    </script>
  </body>
</html>
